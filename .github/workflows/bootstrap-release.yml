# A one-shot workflow, to be deleted once it has run.
#
# npm's trusted publisher is configured on a package's own settings page, so the package has to
# exist before OIDC can be pointed at it. That leaves a chicken-and-egg for the very first release,
# and this resolves it with a granular token — once.
#
# It is `workflow_dispatch` only, never on a tag, so it cannot fire by accident, and it publishes the
# same verified artifact `release.yml` would. Provenance still applies: npm generates it from a
# token-authenticated publish too, as long as `id-token: write` is granted and the source repository
# is public — which is now the case, so even the bootstrap release is attested.
#
# After it succeeds:
#   1. Register the trusted publisher on npmjs.com for this repository and `release.yml`.
#   2. Delete the NPM_TOKEN secret and revoke the token on npmjs.com.
#   3. Delete this file.
name: Bootstrap release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type the version to publish, exactly as it appears in package.json
        required: true

jobs:
  bootstrap:
    name: Bootstrap @stellar-code/hashira
    runs-on: ubuntu-latest

    permissions:
      # Provenance is generated from the OIDC identity even when the publish authenticates with a
      # token, so this is what makes the first release attestable rather than merely published.
      id-token: write

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Use a current npm
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: bun install --frozen-lockfile

      # The input is a confirmation rather than a source of truth: the manifest decides what ships,
      # and a mismatch means whoever triggered this was looking at something else.
      - name: The version is the one you meant
        run: |
          version="$(bun pm pkg get version | tr -d '"')"
          if [ "$version" != "${{ inputs.confirm }}" ]; then
            echo "package.json says $version, you typed ${{ inputs.confirm }}."
            exit 1
          fi
          echo "Publishing $version."

      - name: The publish token is configured
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "The NPM_TOKEN secret is not set."
            echo "Create a granular access token on npmjs.com scoped to the @stellar-code scope,"
            echo "with read and write permission, and add it as the NPM_TOKEN repository secret."
            exit 1
          fi

      - name: The generated types match the API
        run: bun run check-api-types

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Verify the tarball
        run: bun run verify-package

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # --ignore-scripts: `prepublishOnly` asserts a `v*` tag, and a manual run has none. That
        # check is what the version confirmation above stands in for here.
        run: npm publish --ignore-scripts --access public --provenance
